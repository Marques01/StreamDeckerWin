
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>UI</title>
    <base href="/" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="UI.styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="icon" href="data:,">

    <style>
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111018;
            color: #fff;
            opacity: 1;
            visibility: visible;
            transition: opacity .5s ease, visibility .5s ease;
        }

            #app-loading.boot-hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

        .boot-content {
            width: 280px;
            text-align: center;
        }

        .boot-logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: linear-gradient(145deg, #8b5cf6, #6336bd);
            box-shadow: 0 0 35px rgba(139, 92, 246, .25);
            font-size: 27px;
        }

        .boot-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .boot-subtitle {
            margin-top: 5px;
            color: #858195;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .boot-device {
            width: 150px;
            height: 105px;
            margin: 35px auto 30px;
            padding: 12px;
            border: 1px solid #40364f;
            border-radius: 15px;
            background: linear-gradient(145deg, #292432, #191620);
            box-shadow: 0 12px 35px rgba(0, 0, 0, .4);
            transform: perspective(400px) rotateX(8deg);
        }

        .boot-screen {
            height: 35px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: #171421;
            color: #a879ff;
            font-size: 17px;
        }

        .boot-keys {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .boot-key {
            width: 25px;
            height: 25px;
            border: 1px solid #50445f;
            border-radius: 5px;
            background: #373040;
            box-shadow: 0 3px 0 #17141e;
        }

        .boot-loading-text {
            color: #a39caf;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .boot-progress {
            width: 180px;
            height: 3px;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            background: #302a3a;
        }

        .boot-progress-bar {
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: #a879ff;
            animation: boot-progress 1.4s ease-in-out infinite;
        }

        @keyframes boot-progress {
            0% {
                transform: translateX(-110%);
            }

            100% {
                transform: translateX(350%);
            }
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <!-- Tela inicial -->
    <div id="app-loading">
        <div class="boot-content">

            <div class="boot-logo">
                <i class="bi bi-cpu"></i>
            </div>

            <div class="boot-title">STREAM DECK</div>
            <div class="boot-subtitle">CONTROL CENTER</div>

            <div class="boot-device">
                <div class="boot-screen">
                    <i class="bi bi-activity"></i>
                </div>

                <div class="boot-keys">
                    <div class="boot-key"></div>
                    <div class="boot-key"></div>
                    <div class="boot-key"></div>
                </div>
            </div>

            <div class="boot-loading-text">Inicializando sistema...</div>

            <div class="boot-progress">
                <div class="boot-progress-bar"></div>
            </div>

        </div>
    </div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.hideBootLoader = function () {
            const loader = document.getElementById('app-loading');

            if (loader) {
                loader.classList.add('boot-hidden');
            }
        };
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</body>
</html>
